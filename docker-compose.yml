# 基础设施编排：仅启动 Milvus（含 etcd、MinIO）与 PostgreSQL。
# 四个容器位于同一桥接网络 self_rag_net，通过服务名互相访问；
# 仅对外暴露本机 RAG 应用需要的端口（Milvus 19530、PostgreSQL 5432）。
#
# RAG 应用本身不在容器里跑，请在 PyCharm / 虚拟环境中本地运行
# （uvicorn main:app --reload），连接 .env 里的 localhost 地址即可。
#
# 镜像固定为本地已缓存的版本，避免依赖 Docker Hub（当前网络不可达）。

name: self_rag

services:
  postgres:
    image: postgres:16
    container_name: self_rag-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-self_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-self_rag}
      POSTGRES_DB: ${POSTGRES_DB:-self_rag}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - self_rag_net

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: self_rag-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - self_rag_net

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: self_rag-minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - self_rag_net

  milvus:
    image: milvusdb/milvus:v2.5.27
    container_name: self_rag-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "19530:19530"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped
    networks:
      - self_rag_net

volumes:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:

networks:
  self_rag_net:
    name: self_rag_net
    driver: bridge
